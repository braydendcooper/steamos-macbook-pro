# Parsed as a systemd EnvironmentFile; use plain KEY=value lines with values
# that do not need shell quoting. Keep comments on separate lines.

# kwin: KWin owns the display and gamescope runs nested with its SDL backend,
# supporting Apple's split display/GPU. drm: gamescope drives the display
# itself and needs split-device support in gamescope.
NEO_GAME_MODE_HOST=kwin

# Extra gamescope arguments, split on whitespace without glob expansion.
# gamescope scales its cursor by whole multiples of panel height / this value.
# Valve's 720 suits the Deck's 800-line panel but doubles the cursor on the
# Neo's 1506-line panel; 1506 keeps the cursor at its native size.
NEO_GAMESCOPE_EXTRA_ARGS=--cursor-scale-height 1506

# 4k: run the Steam client tree under Aurora per-process 4K pages (requires
# user4k=on on the kernel command line). native: run directly.
NEO_STEAM_PAGE_SIZE=4k

# Standalone argument lines to remove from Valve's RUNSTEAM.sh; empty keeps all.
# -deckard selects the Steam Frame identity/client branch (headset OOBE,
# Frame controller pairing); -vrgamepadui selects the VR UI. The Neo runs
# Steam with -gamepadui -steamdeck -steamos3.
NEO_STEAM_DROP_ARGS=-vrgamepadui -deckard
