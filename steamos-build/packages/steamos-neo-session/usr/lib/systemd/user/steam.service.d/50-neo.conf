# Drop-in for Valve's steam.service (deckard-steam-rel). Valve's own
# ExecStartPre steps run first; the ones below are appended after them.
[Service]
EnvironmentFile=
EnvironmentFile=-/etc/steamos-neo/session.conf
ExecStart=
ExecStart=/usr/lib/steamos-neo/run-steam
# Leave the M1 Pro's efficiency cores (cpu0-1) for the system; games and
# desktop apps may use the performance cores (cpu2-9).
Environment=STEAM_LAUNCH_WRAPPER_AFFINITY_LIST=0x3fc
Environment=STEAM_DESKTOP_APP_AFFINITY_LIST=0x3fc
# Our game defaults, appended to the gfx.txt Valve's step just copied.
ExecStartPre=/bin/bash -c "cat /usr/share/steamos-neo/steam-env-gfx.txt >> ${XDG_RUNTIME_DIR}/steam/env/gfx.txt"
ExecStartPre=/usr/lib/steamos-neo/install-runsteam
# Steam renders its UI at 1920x1080 on what it treats as an external display;
# enable its native-resolution setting once (a failure must not stop Steam).
ExecStartPre=-/usr/lib/steamos-neo/steam-display-defaults
